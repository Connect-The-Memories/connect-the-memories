name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      REACT_APP_DIR: ./connect-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.REACT_APP_DIR }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ env.REACT_APP_DIR }}
        run: npm ci

      - name: Build Application
        working-directory: ${{ env.REACT_APP_DIR }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COGNISPHERE_8A589 }}
          channelId: live
          projectId: cognisphere-8a589
          entryPoint: ${{ env.REACT_APP_DIR }}
